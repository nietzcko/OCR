<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pull — Espresso Scale Reader</title>
<style>
  :root{
    --bg:#0d0b14;--panel:#16131f;--acid:#c8ff00;--hot:#ff4d2e;
    --ink:#efeada;--mute:#76707f;--line:rgba(239,234,218,.1);
    --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,monospace;overflow:hidden;display:flex;flex-direction:column}

  .stage{position:relative;flex:0 0 40%;min-height:0;background:#000;overflow:hidden}
  video,#work{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #work{display:none}
  #roi{position:absolute;border:2px solid var(--acid);box-shadow:0 0 0 9999px rgba(0,0,0,.45);touch-action:none}
  #roi .handle{position:absolute;width:36px;height:36px;border:3px solid var(--acid);background:rgba(200,255,0,.12);border-radius:4px}
  #roi .handle.tl{top:-18px;left:-18px}
  #roi .handle.br{bottom:-18px;right:-18px}
  .hint{position:absolute;top:calc(var(--safe-top) + 10px);left:0;right:0;text-align:center;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink);text-shadow:0 1px 5px #000;pointer-events:none}
  .hint b{color:var(--acid)}
  .focusring{position:absolute;width:64px;height:64px;border:2px solid var(--acid);border-radius:8px;margin:-32px 0 0 -32px;opacity:0;pointer-events:none;transition:.3s}
  .focusring.show{opacity:1;animation:fpulse .5s}
  @keyframes fpulse{0%{transform:scale(1.4)}100%{transform:scale(1)}}

  .zoom{position:absolute;right:10px;top:50%;transform:translateY(-50%);height:46%;display:flex;flex-direction:column;align-items:center;gap:8px}
  .zoom input{writing-mode:vertical-lr;direction:rtl;width:30px;height:100%;accent-color:var(--acid)}
  .zoom span{font-size:9px;color:var(--ink);text-shadow:0 1px 3px #000}

  .readout{flex:0 0 auto;display:flex;align-items:baseline;justify-content:center;gap:10px;padding:10px 0 7px;background:var(--panel);border-bottom:1px solid var(--line);position:relative}
  .readout .val{font-size:50px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
  .readout .val.live{color:var(--acid)}
  .readout .unit{font-size:15px;color:var(--mute)}
  .readout .conf{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--mute);letter-spacing:.14em;text-transform:uppercase;text-align:right}

  .graph{flex:1 1 auto;min-height:0;position:relative;background:var(--bg)}
  #chart{position:absolute;inset:0;width:100%;height:100%}
  .glabel{position:absolute;left:12px;top:9px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
  .glabel b{color:var(--hot)}
  .stats{position:absolute;right:12px;top:9px;text-align:right;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);line-height:1.7}
  .stats span{color:var(--ink)}

  .controls{flex:0 0 auto;display:flex;gap:10px;align-items:center;padding:11px 14px calc(11px + var(--safe-bot));background:var(--panel);border-top:1px solid var(--line)}
  .run{flex:1;padding:16px;border:0;border-radius:14px;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:var(--acid);color:#101400}
  .run.stop{background:var(--hot);color:#fff}
  .run:active{opacity:.8}
  .icon{width:54px;height:54px;border-radius:14px;border:1.5px solid var(--line);background:none;color:var(--ink);font-family:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  .icon:active{background:var(--line)}

  .tray{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);z-index:30;padding:8px 22px calc(20px + var(--safe-bot));box-shadow:0 -16px 50px rgba(0,0,0,.6);max-height:88vh;overflow-y:auto}
  .tray.open{transform:translateY(0)}
  .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 16px}
  .tray h2{font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:16px;color:var(--acid)}
  .field{margin-bottom:18px}
  .field label{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:8px}
  .field label b{color:var(--ink)}
  input[type=range]{width:100%;accent-color:var(--acid);height:26px}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;padding:10px;border:1.5px solid var(--line);background:none;color:var(--mute);border-radius:10px;font-family:inherit;font-size:11px}
  .seg button.on{border-color:var(--acid);color:var(--acid)}
  .preview{display:flex;gap:14px;align-items:center;margin-bottom:18px;padding:12px;border:1px solid var(--line);border-radius:12px}
  #pvCanvas{width:150px;height:60px;background:#000;border-radius:6px;image-rendering:pixelated}
  .preview .pvtxt{font-size:11px;color:var(--mute);line-height:1.5}
  .preview .pvtxt b{color:var(--acid);font-size:26px;display:block;font-variant-numeric:tabular-nums}
  .tray .done{width:100%;padding:15px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-top:4px}

  .toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-bot));transform:translate(-50%,14px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:24px;font-size:12px;opacity:0;pointer-events:none;transition:.22s;z-index:50;max-width:80%;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .err{position:absolute;inset:0;display:none;flex-direction:column;gap:12px;align-items:center;justify-content:center;padding:30px;text-align:center;background:#000}
  .err.show{display:flex}
  .err p{color:var(--mute);font-size:13px;line-height:1.6;max-width:260px}
</style>
</head>
<body>
  <div class="stage" id="stage">
    <video id="cam" autoplay muted playsinline></video>
    <canvas id="work"></canvas>
    <div class="hint">Tap display to <b>focus</b> · drag box over digits</div>
    <div id="roi"><div class="handle tl"></div><div class="handle br"></div></div>
    <div class="focusring" id="focusring"></div>
    <div class="zoom"><span id="zlabel">1×</span><input type="range" id="zoom" min="1" max="5" step="0.1" value="1"></div>
    <div class="err" id="err"><p id="errMsg">Allow camera access. iOS needs HTTPS.</p></div>
  </div>

  <div class="readout">
    <span class="val" id="val">––.–</span>
    <span class="unit">g</span>
    <span class="conf" id="conf"></span>
  </div>

  <div class="graph">
    <canvas id="chart"></canvas>
    <div class="glabel">weight <b>/</b> time</div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="controls">
    <button class="icon" id="calBtn">Tune</button>
    <button class="run" id="runBtn">Start</button>
    <button class="icon" id="clrBtn">Clear</button>
  </div>

  <div class="tray" id="tray">
    <div class="grab"></div>
    <h2>Tune recognition</h2>
    <div class="preview">
      <canvas id="pvCanvas" width="150" height="60"></canvas>
      <div class="pvtxt">reads<b id="pvVal">––</b>green = detected segments</div>
    </div>
    <div class="field">
      <label>Sensitivity <b id="thVal">40</b></label>
      <input type="range" id="thresh" min="10" max="120" value="40">
    </div>
    <div class="field">
      <label>Digit color</label>
      <div class="seg">
        <button id="cBlue">Blue/white</button>
        <button id="cGreen">Green</button>
        <button id="cRed">Red</button>
        <button id="cAny" class="on">Any bright</button>
      </div>
    </div>
    <div class="field">
      <label>Decimal places <b id="decVal">1</b></label>
      <input type="range" id="decimals" min="0" max="3" value="1">
    </div>
    <div class="field">
      <label>Smoothing (reject blips) <b id="smVal">on</b></label>
      <div class="seg">
        <button id="smOn" class="on">Median of 3</button>
        <button id="smOff">Raw</button>
      </div>
    </div>
    <button class="done" id="doneBtn">Done</button>
  </div>

  <div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const cam=$('cam'),work=$('work'),roiEl=$('roi'),chart=$('chart'),stage=$('stage');
let stream=null,track=null,running=false,t0=0,data=[],recent=[];
let cfg={thresh:40,color:'any',decimals:1,digits:4,smooth:true};
let roi={x:0.15,y:0.32,w:0.70,h:0.36};

/* ---------- camera ---------- */
async function startCam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    cam.srcObject=stream;
    track=stream.getVideoTracks()[0];
    try{ await track.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(e){}
    const caps=track.getCapabilities?track.getCapabilities():{};
    if(caps.zoom){
      $('zoom').min=caps.zoom.min;$('zoom').max=caps.zoom.max;
      $('zoom').step=(caps.zoom.max-caps.zoom.min)/40||0.1;$('zoom').value=caps.zoom.min;
    }
  }catch(e){
    $('err').classList.add('show');
    if(e.name==='NotAllowedError')$('errMsg').textContent='Camera denied. Enable in Safari settings and reload.';
  }
}

$('zoom').addEventListener('input',async e=>{
  const z=+e.target.value;$('zlabel').textContent=z.toFixed(1)+'×';
  if(track){try{await track.applyConstraints({advanced:[{zoom:z}]});}catch(err){}}
});

stage.addEventListener('click',async e=>{
  if(e.target.closest('#roi')||e.target.closest('.zoom'))return;
  const r=stage.getBoundingClientRect();
  const fr=$('focusring');
  fr.style.left=(e.clientX-r.left)+'px';fr.style.top=(e.clientY-r.top)+'px';
  fr.classList.remove('show');void fr.offsetWidth;fr.classList.add('show');
  if(track){
    try{
      const px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
      await track.applyConstraints({advanced:[{focusMode:'manual',pointsOfInterest:[{x:px,y:py}]}]});
      await track.applyConstraints({advanced:[{focusMode:'continuous'}]});
    }catch(err){}
  }
});

/* ---------- ROI drag ---------- */
function layoutRoi(){
  const r=stage.getBoundingClientRect();
  roiEl.style.left=roi.x*r.width+'px';roiEl.style.top=roi.y*r.height+'px';
  roiEl.style.width=roi.w*r.width+'px';roiEl.style.height=roi.h*r.height+'px';
}
let drag=null;
const pt=e=>({x:e.clientX,y:e.clientY});
roiEl.addEventListener('pointerdown',e=>{
  e.stopPropagation();
  const r=stage.getBoundingClientRect();
  const tl=e.target.classList.contains('tl'),br=e.target.classList.contains('br');
  drag={mode:tl?'tl':br?'br':'move',start:pt(e),roi:{...roi},rect:r};
  roiEl.setPointerCapture(e.pointerId);
});
roiEl.addEventListener('pointermove',e=>{
  if(!drag)return;
  const p=pt(e),r=drag.rect;
  const dx=(p.x-drag.start.x)/r.width,dy=(p.y-drag.start.y)/r.height;
  let n={...drag.roi};
  if(drag.mode==='move'){n.x+=dx;n.y+=dy;}
  else if(drag.mode==='tl'){n.x+=dx;n.y+=dy;n.w-=dx;n.h-=dy;}
  else{n.w+=dx;n.h+=dy;}
  n.w=Math.max(.12,n.w);n.h=Math.max(.06,n.h);
  n.x=Math.max(0,Math.min(n.x,1-n.w));n.y=Math.max(0,Math.min(n.y,1-n.h));
  roi=n;layoutRoi();
  if($('tray').classList.contains('open'))updatePreview();
});
roiEl.addEventListener('pointerup',()=>drag=null);

/* ---------- capture ROI ---------- */
const PW=200,PH=80;
function grabROI(){
  const vw=cam.videoWidth,vh=cam.videoHeight;if(!vw)return null;
  const st=stage.getBoundingClientRect();
  const scale=Math.max(st.width/vw,st.height/vh);
  const dispW=vw*scale,dispH=vh*scale;
  const offX=(dispW-st.width)/2,offY=(dispH-st.height)/2;
  const sx=(roi.x*st.width+offX)/scale,sy=(roi.y*st.height+offY)/scale;
  const sw=(roi.w*st.width)/scale,sh=(roi.h*st.height)/scale;
  work.width=PW;work.height=PH;
  const ctx=work.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(cam,sx,sy,sw,sh,0,0,PW,PH);
  return ctx.getImageData(0,0,PW,PH);
}

/* ============================================================
   SSOCR-style seven-segment recognition
   1. threshold -> binary mask
   2. morphological close (bridge gaps within a digit)
   3. connected-component labeling -> blobs
   4. filter blobs by size/aspect (drop "g", power icon, speckles)
   5. detect digits vs decimal-point dots
   6. read each digit's 7 segments
   ============================================================ */

/* 1. threshold */
function buildMask(img){
  const W=img.width,H=img.height,d=img.data;
  const mask=new Uint8Array(W*H);
  const T=cfg.thresh;
  for(let i=0,p=0;i<d.length;i+=4,p++){
    const r=d[i],g=d[i+1],b=d[i+2];
    const lum=0.299*r+0.587*g+0.114*b;
    let hit=false;
    if(cfg.color==='blue')      hit=(b>80 && b-r>T*0.25 && lum>60);
    else if(cfg.color==='green')hit=(g>80 && g-r>T*0.25 && g-b>T*0.15);
    else if(cfg.color==='red')  hit=(r>80 && r-g>T*0.35 && r-b>T*0.25);
    else                        hit=(lum>110+T);
    mask[p]=hit?1:0;
  }
  return mask;
}

/* 2. morphological close: dilate then erode, radius 1 (4-neighborhood) */
function morphClose(mask,W,H){
  const dil=new Uint8Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    let on=mask[y*W+x];
    if(!on){
      if(x>0&&mask[y*W+x-1])on=1;
      else if(x<W-1&&mask[y*W+x+1])on=1;
      else if(y>0&&mask[(y-1)*W+x])on=1;
      else if(y<H-1&&mask[(y+1)*W+x])on=1;
    }
    dil[y*W+x]=on;
  }
  const ero=new Uint8Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    let on=dil[y*W+x];
    if(on){
      if(x>0&&!dil[y*W+x-1])on=0;
      else if(x<W-1&&!dil[y*W+x+1])on=0;
      else if(y>0&&!dil[(y-1)*W+x])on=0;
      else if(y<H-1&&!dil[(y+1)*W+x])on=0;
    }
    ero[y*W+x]=on;
  }
  return ero;
}

/* 3. connected components (8-connectivity), iterative flood fill */
function components(mask,W,H){
  const lab=new Int32Array(W*H).fill(0);
  const blobs=[];
  const stack=[];
  let id=0;
  for(let sy=0;sy<H;sy++)for(let sx=0;sx<W;sx++){
    const sp=sy*W+sx;
    if(!mask[sp]||lab[sp])continue;
    id++;
    let x0=sx,x1=sx,y0=sy,y1=sy,area=0;
    stack.length=0;stack.push(sp);lab[sp]=id;
    while(stack.length){
      const p=stack.pop();const px=p%W,py=(p/W)|0;
      area++;
      if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        if(!dx&&!dy)continue;
        const nx=px+dx,ny=py+dy;
        if(nx<0||nx>=W||ny<0||ny>=H)continue;
        const np=ny*W+nx;
        if(mask[np]&&!lab[np]){lab[np]=id;stack.push(np);}
      }
    }
    blobs.push({x0,x1,y0,y1,area,w:x1-x0+1,h:y1-y0+1});
  }
  return blobs;
}

const PATTERNS={
  '1111110':'0','0110000':'1','1101101':'2','1111001':'3','0110011':'4',
  '1011011':'5','1011111':'6','1110000':'7','1111111':'8','1111011':'9'
};

/* 6. read one digit blob's segments */
function readDigit(mask,W,H,b){
  const gx0=b.x0,gx1=b.x1,y0=b.y0,y1=b.y1;
  const gw=gx1-gx0+1,gh=y1-y0+1;
  const seg=(zx0,zx1,zy0,zy1)=>{
    let on=0,tot=0;
    const X0=gx0+zx0*gw,X1=gx0+zx1*gw,Y0=y0+zy0*gh,Y1=y0+zy1*gh;
    for(let y=Math.floor(Y0);y<=Y1;y++)for(let x=Math.floor(X0);x<=X1;x++){
      if(x<0||x>=W||y<0||y>=H)continue;tot++;if(mask[y*W+x])on++;
    }
    return tot?on/tot:0;
  };
  // tall & thin -> "1"
  if(gw/gh < 0.42) return '1';
  const F=0.30;
  const a =seg(.20,.80,.00,.18)>F?1:0;
  const f =seg(.00,.30,.08,.46)>F?1:0;
  const b2=seg(.70,1.0,.08,.46)>F?1:0;
  const gm=seg(.20,.80,.42,.58)>F?1:0;
  const e =seg(.00,.30,.54,.92)>F?1:0;
  const c =seg(.70,1.0,.54,.92)>F?1:0;
  const dd=seg(.20,.80,.82,1.0)>F?1:0;
  return PATTERNS[`${a}${b2}${c}${dd}${e}${f}${gm}`]||'?';
}

function recognize(img){
  const W=img.width,H=img.height;
  let mask=buildMask(img);
  mask=morphClose(mask,W,H);
  let blobs=components(mask,W,H);
  if(!blobs.length)return {ok:false,mask,str:''};

  // reference digit height = tallest blob (a real digit)
  const maxH=Math.max(...blobs.map(b=>b.h));
  if(maxH < H*0.25)return {ok:false,mask,str:''}; // nothing big enough

  // classify blobs: digits vs decimal dots vs junk
  const digits=[], dots=[];
  for(const b of blobs){
    const tall = b.h >= maxH*0.55;
    const aspect = b.w/b.h;
    const small = b.h < maxH*0.35;
    // decimal point: small, low in the display, roughly square
    if(small && b.area>2 && b.area < maxH*maxH*0.10 && b.y1 > maxH*0.55){
      dots.push(b);continue;
    }
    // digit: tall enough, not absurdly wide (icons), reasonable area
    if(tall && aspect < 1.4 && b.area > maxH*2){
      digits.push(b);
    }
    // everything else (g label, power icon, wifi icon, speckle) ignored
  }
  if(!digits.length)return {ok:false,mask,str:''};

  digits.sort((p,q)=>p.x0-q.x0);
  dots.sort((p,q)=>p.x0-q.x0);

  // build string, inserting '.' where a dot sits between/after digits
  let str='';
  for(let i=0;i<digits.length;i++){
    str+=readDigit(mask,W,H,digits[i]);
    // is there a dot just to the right of this digit (before next)?
    const rightEdge = digits[i].x1;
    const nextLeft = i<digits.length-1 ? digits[i+1].x0 : W;
    if(dots.some(dt=>dt.x0>=rightEdge-2 && dt.x1<=nextLeft+2)){
      str+='.';
    }
  }
  return {ok:!str.includes('?') && /\d/.test(str), str, mask};
}

function parseReading(str){
  if(!str||str.includes('?'))return {ok:false};
  const d=cfg.decimals;
  // count digits only
  const digitsOnly=str.replace(/[^\d]/g,'');
  if(!digitsOnly.length)return {ok:false};
  // If a dot was detected optically AND it agrees with the decimals setting
  // (i.e. it sits 'd' places from the end), trust the string as-is.
  if(str.includes('.')){
    const afterDot=str.split('.')[1]?.replace(/[^\d]/g,'').length ?? 0;
    if(d===0 || afterDot===d){
      const v=parseFloat(str.replace(/[^\d.]/g,''));
      if(!isNaN(v))return {ok:true,v};
    }
  }
  // Otherwise place the decimal by the configured number of places.
  let s=digitsOnly.replace(/^0+(?=\d)/,'');
  if(!s)s='0';
  if(d>0){
    while(s.length<=d)s='0'+s;
    s=s.slice(0,-d)+'.'+s.slice(-d);
  }
  const v=parseFloat(s);
  return isNaN(v)?{ok:false}:{ok:true,v};
}

function smooth(v){
  recent.push(v);if(recent.length>3)recent.shift();
  if(!cfg.smooth||recent.length<3)return v;
  return [...recent].sort((a,b)=>a-b)[1];
}

function sampleOnce(){
  const img=grabROI();if(!img)return;
  const rec=recognize(img);
  const r=rec.ok?parseReading(rec.str):{ok:false};
  if(r.ok){
    const v=smooth(r.v);
    $('val').textContent=v.toFixed(cfg.decimals);
    $('val').classList.add('live');$('conf').textContent='';
    if(running){const t=(Date.now()-t0)/1000;data.push({t,w:v});drawChart();updateStats();}
  }else{$('conf').textContent='no read';$('val').classList.remove('live');}
}

/* ---------- chart ---------- */
function drawChart(){
  const dpr=window.devicePixelRatio||1;
  const r=chart.parentElement.getBoundingClientRect();
  chart.width=r.width*dpr;chart.height=r.height*dpr;
  const ctx=chart.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  const W=r.width,H=r.height,L=34,R=10,T=28,B=20;
  ctx.clearRect(0,0,W,H);if(data.length<2)return;
  const tMax=Math.max(2,data[data.length-1].t);
  const wMax=Math.max(2,...data.map(d=>d.w))*1.1;
  const X=t=>L+(t/tMax)*(W-L-R),Y=w=>H-B-(w/wMax)*(H-T-B);
  ctx.strokeStyle='rgba(239,234,218,.08)';ctx.fillStyle='#76707f';ctx.font='9px ui-monospace';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){const w=wMax*i/4,y=Y(w);ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(W-R,y);ctx.stroke();ctx.fillText(w.toFixed(0),4,y+3);}
  ctx.beginPath();ctx.moveTo(X(data[0].t),Y(data[0].w));data.forEach(d=>ctx.lineTo(X(d.t),Y(d.w)));
  ctx.lineTo(X(data[data.length-1].t),H-B);ctx.lineTo(X(data[0].t),H-B);ctx.closePath();
  const g=ctx.createLinearGradient(0,T,0,H-B);g.addColorStop(0,'rgba(255,77,46,.35)');g.addColorStop(1,'rgba(255,77,46,0)');ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.moveTo(X(data[0].t),Y(data[0].w));data.forEach(d=>ctx.lineTo(X(d.t),Y(d.w)));ctx.strokeStyle='#ff4d2e';ctx.lineWidth=2;ctx.stroke();
  const last=data[data.length-1];ctx.fillStyle='#c8ff00';ctx.beginPath();ctx.arc(X(last.t),Y(last.w),3.5,0,7);ctx.fill();
}
function updateStats(){
  if(!data.length){$('stats').innerHTML='';return;}
  const last=data[data.length-1];let flow=0;
  if(data.length>3){const a=data[data.length-4];flow=(last.w-a.w)/Math.max(.1,last.t-a.t);}
  $('stats').innerHTML=`time <span>${last.t.toFixed(1)}s</span><br>final <span>${last.w.toFixed(cfg.decimals)}g</span><br>flow <span>${flow.toFixed(1)}g/s</span>`;
}

/* ---------- preview ---------- */
function updatePreview(){
  const img=grabROI();if(!img)return;
  const rec=recognize(img);
  const pv=$('pvCanvas'),ctx=pv.getContext('2d');
  const tmp=document.createElement('canvas');tmp.width=img.width;tmp.height=img.height;
  const tc=tmp.getContext('2d'),id=tc.createImageData(img.width,img.height);
  for(let p=0;p<rec.mask.length;p++){
    const i=p*4,on=rec.mask[p];
    id.data[i]=on?200:15;id.data[i+1]=on?255:15;id.data[i+2]=on?0:22;id.data[i+3]=255;
  }
  tc.putImageData(id,0,0);
  ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,pv.width,pv.height);ctx.drawImage(tmp,0,0,pv.width,pv.height);
  const r=rec.ok?parseReading(rec.str):{ok:false};
  $('pvVal').textContent=r.ok?r.v.toFixed(cfg.decimals):(rec.str||'––');
}

/* ---------- controls ---------- */
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('show'),1800);}
$('runBtn').addEventListener('click',()=>{
  running=!running;
  if(running){t0=data.length?Date.now()-data[data.length-1].t*1000:Date.now();$('runBtn').textContent='Stop';$('runBtn').classList.add('stop');toast('Recording every second');}
  else{$('runBtn').textContent='Start';$('runBtn').classList.remove('stop');}
});
$('clrBtn').addEventListener('click',()=>{data=[];recent=[];drawChart();updateStats();$('stats').innerHTML='';toast('Cleared');});
$('calBtn').addEventListener('click',()=>{$('tray').classList.add('open');updatePreview();});
$('doneBtn').addEventListener('click',()=>$('tray').classList.remove('open'));
$('thresh').addEventListener('input',e=>{cfg.thresh=+e.target.value;$('thVal').textContent=cfg.thresh;updatePreview();});
$('decimals').addEventListener('input',e=>{cfg.decimals=+e.target.value;$('decVal').textContent=cfg.decimals;updatePreview();});
function setColor(c,btn){cfg.color=c;['cBlue','cGreen','cRed','cAny'].forEach(id=>$(id).classList.remove('on'));btn.classList.add('on');updatePreview();}
$('cBlue').onclick=e=>setColor('blue',e.target);
$('cGreen').onclick=e=>setColor('green',e.target);
$('cRed').onclick=e=>setColor('red',e.target);
$('cAny').onclick=e=>setColor('any',e.target);
$('smOn').onclick=()=>{cfg.smooth=true;$('smOn').classList.add('on');$('smOff').classList.remove('on');$('smVal').textContent='on';};
$('smOff').onclick=()=>{cfg.smooth=false;$('smOff').classList.add('on');$('smOn').classList.remove('on');$('smVal').textContent='off';};

setInterval(sampleOnce,1000);
setInterval(()=>{if($('tray').classList.contains('open'))updatePreview();},300);
cam.addEventListener('loadedmetadata',()=>{layoutRoi();drawChart();});
window.addEventListener('resize',()=>{layoutRoi();drawChart();});
layoutRoi();startCam();
</script>
