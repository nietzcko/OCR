<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lumen — Text Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --ink:#0a0e14;
    --paper:#f6f3ec;
    --signal:#ff5436;
    --mute:#8a8578;
    --line:rgba(10,14,20,.12);
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    overflow:hidden;
    display:flex;flex-direction:column;
  }

  /* ---- Camera stage ---- */
  .stage{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    overflow:hidden;
    background:#000;
  }
  video,#frame{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
  }
  #frame{display:none}

  /* viewfinder corners */
  .reticle{
    position:absolute;
    inset:14% 8% auto 8%;
    aspect-ratio:4/3;
    pointer-events:none;
  }
  .reticle span{
    position:absolute;width:26px;height:26px;
    border:2px solid var(--signal);
  }
  .reticle span:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
  .reticle span:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
  .reticle span:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
  .reticle span:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}

  .eyebrow{
    position:absolute;
    top:calc(var(--safe-top) + 16px);
    left:0;right:0;
    text-align:center;
    font-size:11px;letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--paper);
    text-shadow:0 1px 6px rgba(0,0,0,.7);
  }
  .eyebrow b{color:var(--signal);font-weight:700}

  /* scanning sweep */
  .sweep{
    position:absolute;left:8%;right:8%;
    height:2px;background:var(--signal);
    box-shadow:0 0 16px var(--signal);
    top:14%;opacity:0;
  }
  body.busy .sweep{
    opacity:1;
    animation:sweep 1.1s ease-in-out infinite;
  }
  @keyframes sweep{
    0%{top:16%}50%{top:74%}100%{top:16%}
  }

  /* ---- Control bar ---- */
  .controls{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;gap:30px;
    padding:18px 0 calc(14px + var(--safe-bot));
    background:var(--ink);
    border-top:1px solid rgba(246,243,236,.08);
  }
  .ghost{
    background:none;border:0;color:var(--paper);
    font-family:inherit;font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;opacity:.7;
    width:64px;text-align:center;
  }
  .ghost:active{opacity:1}
  .shutter{
    width:74px;height:74px;border-radius:50%;
    border:3px solid var(--paper);
    background:var(--signal);
    display:grid;place-items:center;
  }
  .shutter:active{transform:scale(.93)}
  .shutter:disabled{background:var(--mute);border-color:var(--mute)}
  .shutter::after{
    content:"";width:54px;height:54px;border-radius:50%;
    border:2px solid var(--ink);
  }

  /* ---- Results sheet ---- */
  .sheet{
    position:fixed;left:0;right:0;bottom:0;
    height:78vh;
    background:var(--paper);
    color:var(--ink);
    border-radius:22px 22px 0 0;
    transform:translateY(100%);
    transition:transform .42s cubic-bezier(.2,.9,.25,1);
    display:flex;flex-direction:column;
    z-index:20;
    box-shadow:0 -20px 60px rgba(0,0,0,.5);
  }
  .sheet.open{transform:translateY(0)}
  .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:11px auto 0}
  .sheet header{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:16px 22px 12px;border-bottom:1px solid var(--line);
  }
  .sheet h1{
    font-size:19px;font-weight:700;letter-spacing:-.01em;
    font-family:Georgia,"Times New Roman",serif;
  }
  .count{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--signal)}
  .list{flex:1;overflow-y:auto;padding:8px 0 0;-webkit-overflow-scrolling:touch}
  .row{
    display:flex;gap:14px;align-items:flex-start;
    padding:13px 22px;border-bottom:1px solid var(--line);
  }
  .row .n{
    font-size:11px;color:var(--mute);
    min-width:24px;padding-top:3px;
    font-variant-numeric:tabular-nums;
  }
  .row .t{
    flex:1;font-family:Georgia,serif;font-size:16px;line-height:1.45;
    word-break:break-word;
  }
  .empty{padding:48px 28px;text-align:center;color:var(--mute);font-size:14px;line-height:1.6}
  .sheet footer{
    display:flex;gap:12px;padding:14px 22px calc(16px + var(--safe-bot));
    border-top:1px solid var(--line);
  }
  .btn{
    flex:1;padding:15px;border:0;border-radius:13px;
    font-family:inherit;font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  }
  .btn.copy{background:var(--ink);color:var(--paper)}
  .btn.again{background:none;border:1.5px solid var(--ink);color:var(--ink)}
  .btn:active{opacity:.7}

  .toast{
    position:fixed;left:50%;bottom:calc(20px + var(--safe-bot));
    transform:translate(-50%,20px);
    background:var(--ink);color:var(--paper);
    padding:11px 20px;border-radius:30px;font-size:13px;
    opacity:0;pointer-events:none;transition:.25s;z-index:40;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .err{
    position:absolute;inset:0;display:none;
    flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:34px;text-align:center;background:var(--ink);
  }
  .err.show{display:flex}
  .err p{color:var(--mute);font-size:14px;line-height:1.6;max-width:280px}
  .err button{margin-top:6px}
</style>
</head>
<body>
  <div class="stage">
    <video id="cam" autoplay muted playsinline></video>
    <canvas id="frame"></canvas>

    <div class="eyebrow">Lumen <b>·</b> point at any text</div>
    <div class="reticle"><span></span><span></span><span></span><span></span></div>
    <div class="sweep"></div>

    <div class="err" id="err">
      <div class="eyebrow" style="position:static">Camera blocked</div>
      <p id="errMsg">Allow camera access in Safari, then reload. On iOS, the page must be served over HTTPS.</p>
      <button class="btn copy" style="flex:0;padding:13px 26px" onclick="location.reload()">Reload</button>
    </div>
  </div>

  <div class="controls">
    <button class="ghost" id="flipBtn">Flip</button>
    <button class="shutter" id="shutter" aria-label="Scan text"></button>
    <button class="ghost" id="listBtn">List</button>
  </div>

  <section class="sheet" id="sheet">
    <div class="grab"></div>
    <header>
      <h1>Recognized text</h1>
      <span class="count" id="count">0 lines</span>
    </header>
    <div class="list" id="list">
      <div class="empty">Nothing scanned yet.<br>Aim at some text and tap the shutter.</div>
    </div>
    <footer>
      <button class="btn again" id="closeBtn">Scan again</button>
      <button class="btn copy" id="copyBtn">Copy all</button>
    </footer>
  </section>

  <div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const cam=$('cam'), frame=$('frame'), shutter=$('shutter'),
      sheet=$('sheet'), list=$('list'), count=$('count');
let stream=null, facing='environment', lines=[];

async function startCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:facing}, width:{ideal:1920}, height:{ideal:1080} },
      audio:false
    });
    cam.srcObject = stream;
    $('err').classList.remove('show');
  }catch(e){
    $('err').classList.add('show');
    if(e.name==='NotAllowedError') $('errMsg').textContent='Camera permission was denied. Enable it for this site in Safari settings, then reload.';
  }
}

function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._); t._=setTimeout(()=>t.classList.remove('show'),1800);
}

async function scan(){
  if(!stream || document.body.classList.contains('busy')) return;
  document.body.classList.add('busy');
  shutter.disabled=true;
  toast('Reading text…');

  const vw=cam.videoWidth, vh=cam.videoHeight;
  frame.width=vw; frame.height=vh;
  const ctx=frame.getContext('2d');
  ctx.drawImage(cam,0,0,vw,vh);

  // light contrast boost for cleaner OCR
  const img=ctx.getImageData(0,0,vw,vh), d=img.data;
  for(let i=0;i<d.length;i+=4){
    const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    const v=g>128 ? Math.min(255,g*1.15) : g*0.85;
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(img,0,0);

  try{
    const { data } = await Tesseract.recognize(frame,'eng');
    const found = data.text.split('\n')
      .map(s=>s.trim())
      .filter(s=>s.length>1);
    if(found.length){
      lines = found;
      render();
      openSheet();
      toast(found.length+' lines found');
    }else{
      toast('No text detected — try again');
    }
  }catch(e){
    toast('Scan failed');
  }finally{
    document.body.classList.remove('busy');
    shutter.disabled=false;
  }
}

function render(){
  count.textContent = lines.length+(lines.length===1?' line':' lines');
  if(!lines.length){
    list.innerHTML='<div class="empty">Nothing scanned yet.<br>Aim at some text and tap the shutter.</div>';
    return;
  }
  list.innerHTML = lines.map((l,i)=>
    `<div class="row"><span class="n">${String(i+1).padStart(2,'0')}</span><span class="t"></span></div>`
  ).join('');
  // set text via DOM to avoid injection
  [...list.querySelectorAll('.t')].forEach((el,i)=>el.textContent=lines[i]);
}

function openSheet(){ sheet.classList.add('open'); }
function closeSheet(){ sheet.classList.remove('open'); }

shutter.addEventListener('click',scan);
$('listBtn').addEventListener('click',openSheet);
$('closeBtn').addEventListener('click',closeSheet);
$('flipBtn').addEventListener('click',()=>{
  facing = facing==='environment' ? 'user' : 'environment';
  startCam();
});
$('copyBtn').addEventListener('click',async()=>{
  if(!lines.length){ toast('Nothing to copy'); return; }
  try{
    await navigator.clipboard.writeText(lines.join('\n'));
    toast('Copied to clipboard');
  }catch{
    toast('Copy not allowed here');
  }
});

startCam();
</script>
</body>
</html>
