<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pull — Espresso Scale Reader</title>
<style>
  :root{
    --bg:#0d0b14;
    --panel:#16131f;
    --acid:#c8ff00;
    --hot:#ff4d2e;
    --ink:#efeada;
    --mute:#76707f;
    --line:rgba(239,234,218,.1);
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    overflow:hidden;display:flex;flex-direction:column;
  }

  /* ---------- camera + ROI ---------- */
  .stage{position:relative;flex:0 0 42%;min-height:0;background:#000;overflow:hidden}
  video,#work{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #work{display:none}
  #roi{
    position:absolute;border:2px solid var(--acid);
    box-shadow:0 0 0 9999px rgba(0,0,0,.45);
    touch-action:none;
  }
  #roi .handle{
    position:absolute;width:34px;height:34px;border:3px solid var(--acid);
    background:rgba(200,255,0,.15);border-radius:4px;
  }
  #roi .handle.tl{top:-17px;left:-17px}
  #roi .handle.br{bottom:-17px;right:-17px}
  .hint{
    position:absolute;top:calc(var(--safe-top) + 12px);left:0;right:0;
    text-align:center;font-size:10px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--ink);text-shadow:0 1px 5px #000;pointer-events:none;
  }
  .hint b{color:var(--acid)}

  /* ---------- readout ---------- */
  .readout{
    flex:0 0 auto;display:flex;align-items:baseline;justify-content:center;gap:10px;
    padding:12px 0 8px;background:var(--panel);border-bottom:1px solid var(--line);
  }
  .readout .val{
    font-size:54px;font-weight:700;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;line-height:1;color:var(--ink);
  }
  .readout .val.live{color:var(--acid)}
  .readout .unit{font-size:16px;color:var(--mute);letter-spacing:.1em}
  .readout .conf{
    position:absolute;right:16px;margin-top:6px;font-size:10px;color:var(--mute);
    letter-spacing:.16em;text-transform:uppercase;
  }

  /* ---------- graph ---------- */
  .graph{flex:1 1 auto;min-height:0;position:relative;background:var(--bg)}
  #chart{position:absolute;inset:0;width:100%;height:100%}
  .glabel{
    position:absolute;left:12px;top:10px;font-size:10px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--mute);
  }
  .glabel b{color:var(--hot)}
  .stats{
    position:absolute;right:12px;top:10px;text-align:right;font-size:10px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--mute);line-height:1.7;
  }
  .stats span{color:var(--ink)}

  /* ---------- controls ---------- */
  .controls{
    flex:0 0 auto;display:flex;gap:10px;align-items:center;
    padding:12px 14px calc(12px + var(--safe-bot));background:var(--panel);
    border-top:1px solid var(--line);
  }
  .run{
    flex:1;padding:17px;border:0;border-radius:14px;font-family:inherit;
    font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    background:var(--acid);color:#101400;
  }
  .run.stop{background:var(--hot);color:#fff}
  .run:active{opacity:.8}
  .icon{
    width:54px;height:54px;border-radius:14px;border:1.5px solid var(--line);
    background:none;color:var(--ink);font-family:inherit;font-size:10px;
    letter-spacing:.1em;text-transform:uppercase;
  }
  .icon:active{background:var(--line)}

  /* ---------- calibration tray ---------- */
  .tray{
    position:fixed;left:0;right:0;bottom:0;background:var(--panel);
    border-radius:20px 20px 0 0;transform:translateY(100%);
    transition:transform .38s cubic-bezier(.2,.9,.25,1);z-index:30;
    padding:8px 22px calc(22px + var(--safe-bot));
    box-shadow:0 -16px 50px rgba(0,0,0,.6);
  }
  .tray.open{transform:translateY(0)}
  .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 18px}
  .tray h2{font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:18px;color:var(--acid)}
  .field{margin-bottom:22px}
  .field label{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:9px}
  .field label b{color:var(--ink)}
  input[type=range]{width:100%;accent-color:var(--acid);height:26px}
  .seg{display:flex;gap:8px}
  .seg button{
    flex:1;padding:11px;border:1.5px solid var(--line);background:none;color:var(--mute);
    border-radius:10px;font-family:inherit;font-size:12px;
  }
  .seg button.on{border-color:var(--acid);color:var(--acid)}
  .preview{
    display:flex;gap:14px;align-items:center;margin-bottom:20px;
    padding:12px;border:1px solid var(--line);border-radius:12px;
  }
  #pvCanvas{width:120px;height:54px;background:#000;border-radius:6px;image-rendering:pixelated}
  .preview .pvtxt{font-size:11px;color:var(--mute);line-height:1.6}
  .preview .pvtxt b{color:var(--acid);font-size:22px;display:block}
  .tray .done{
    width:100%;padding:15px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);
    font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  }

  .toast{
    position:fixed;left:50%;bottom:calc(96px + var(--safe-bot));transform:translate(-50%,14px);
    background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:24px;
    font-size:12px;opacity:0;pointer-events:none;transition:.22s;z-index:50;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .err{
    position:absolute;inset:0;display:none;flex-direction:column;gap:12px;
    align-items:center;justify-content:center;padding:30px;text-align:center;background:#000;
  }
  .err.show{display:flex}
  .err p{color:var(--mute);font-size:13px;line-height:1.6;max-width:260px}
</style>
</head>
<body>
  <div class="stage">
    <video id="cam" autoplay muted playsinline></video>
    <canvas id="work"></canvas>
    <div class="hint">Drag the <b>box</b> over the digits</div>
    <div id="roi"><div class="handle tl"></div><div class="handle br"></div></div>
    <div class="err" id="err"><p id="errMsg">Allow camera access. iOS needs the page served over HTTPS.</p></div>
  </div>

  <div class="readout">
    <span class="val" id="val">––.–</span>
    <span class="unit">g</span>
    <span class="conf" id="conf"></span>
  </div>

  <div class="graph">
    <canvas id="chart"></canvas>
    <div class="glabel">weight <b>/</b> time</div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="controls">
    <button class="icon" id="calBtn">Tune</button>
    <button class="run" id="runBtn">Start</button>
    <button class="icon" id="clrBtn">Clear</button>
  </div>

  <div class="tray" id="tray">
    <div class="grab"></div>
    <h2>Tune recognition</h2>
    <div class="preview">
      <canvas id="pvCanvas" width="120" height="54"></canvas>
      <div class="pvtxt">reads as<b id="pvVal">––</b>adjust until it matches the scale</div>
    </div>
    <div class="field">
      <label>Brightness threshold <b id="thVal">128</b></label>
      <input type="range" id="thresh" min="40" max="220" value="128">
    </div>
    <div class="field">
      <label>Digit polarity</label>
      <div class="seg">
        <button id="polLight" class="on">Light on dark</button>
        <button id="polDark">Dark on light</button>
      </div>
    </div>
    <div class="field">
      <label>Decimal places <b id="decVal">1</b></label>
      <input type="range" id="decimals" min="0" max="2" value="1">
    </div>
    <button class="done" id="doneBtn">Done</button>
  </div>

  <div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const cam=$('cam'), work=$('work'), roiEl=$('roi'), chart=$('chart');
let stream=null, running=false, timer=null, t0=0;
let data=[]; // {t, w}
let cfg={ thresh:128, polarity:'light', decimals:1 };
let roi={x:0.18,y:0.30,w:0.64,h:0.40}; // fractions of stage

/* ---------- camera ---------- */
async function startCam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    cam.srcObject=stream;
  }catch(e){
    $('err').classList.add('show');
    if(e.name==='NotAllowedError')$('errMsg').textContent='Camera permission denied. Enable it in Safari settings and reload.';
  }
}

/* ---------- ROI drag ---------- */
function layoutRoi(){
  const s=$('.stage')||cam.parentElement, r=cam.parentElement.getBoundingClientRect();
  roiEl.style.left=roi.x*r.width+'px';
  roiEl.style.top=roi.y*r.height+'px';
  roiEl.style.width=roi.w*r.width+'px';
  roiEl.style.height=roi.h*r.height+'px';
}
let drag=null;
function pt(e){const t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY};}
roiEl.addEventListener('pointerdown',e=>{
  const r=cam.parentElement.getBoundingClientRect();
  const tl=e.target.classList.contains('tl'), br=e.target.classList.contains('br');
  drag={mode:tl?'tl':br?'br':'move',start:pt(e),roi:{...roi},rect:r};
  roiEl.setPointerCapture(e.pointerId);
});
roiEl.addEventListener('pointermove',e=>{
  if(!drag)return;
  const p=pt(e), r=drag.rect;
  const dx=(p.x-drag.start.x)/r.width, dy=(p.y-drag.start.y)/r.height;
  let n={...drag.roi};
  if(drag.mode==='move'){n.x+=dx;n.y+=dy;}
  else if(drag.mode==='tl'){n.x+=dx;n.y+=dy;n.w-=dx;n.h-=dy;}
  else{n.w+=dx;n.h+=dy;}
  n.w=Math.max(.12,n.w);n.h=Math.max(.08,n.h);
  n.x=Math.max(0,Math.min(n.x,1-n.w));n.y=Math.max(0,Math.min(n.y,1-n.h));
  roi=n;layoutRoi();
  if($('tray').classList.contains('open'))updatePreview();
});
roiEl.addEventListener('pointerup',()=>drag=null);

/* ---------- seven-segment recognition ----------
   For each digit cell we test 7 segments. Each segment is sampled
   at a point; "lit" if it passes the brightness threshold. The 7-bit
   pattern maps to a digit. */
const SEG_MAP={
  0b1111110:'0',0b0110000:'1',0b1101101:'2',0b1111001:'3',
  0b0110011:'4',0b1011011:'5',0b1011111:'6',0b1110000:'7',
  0b1111111:'8',0b1111011:'9',0b0000000:' '
};
// segment sample points within a digit cell (x,y as 0..1). order: a b c d e f g
const SEG_PTS=[
  [.5,.08],[.85,.28],[.85,.72],[.5,.92],[.15,.72],[.15,.28],[.5,.5]
];

function grabROI(){
  const vw=cam.videoWidth, vh=cam.videoHeight;
  if(!vw)return null;
  // map stage-fraction ROI onto the video, accounting for object-fit:cover
  const stage=cam.parentElement.getBoundingClientRect();
  const scale=Math.max(stage.width/vw, stage.height/vh);
  const dispW=vw*scale, dispH=vh*scale;
  const offX=(dispW-stage.width)/2, offY=(dispH-stage.height)/2;
  const sx=(roi.x*stage.width+offX)/scale;
  const sy=(roi.y*stage.height+offY)/scale;
  const sw=(roi.w*stage.width)/scale;
  const sh=(roi.h*stage.height)/scale;
  const W=240,H=100;
  work.width=W;work.height=H;
  const ctx=work.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(cam,sx,sy,sw,sh,0,0,W,H);
  return ctx.getImageData(0,0,W,H);
}

function lit(img,px,py){
  const W=img.width,H=img.height;
  const x=Math.floor(px*W), y=Math.floor(py*H);
  let sum=0,c=0;
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
    const xx=Math.min(W-1,Math.max(0,x+dx)), yy=Math.min(H-1,Math.max(0,y+dy));
    const i=(yy*W+xx)*4;
    sum+=0.299*img.data[i]+0.587*img.data[i+1]+0.114*img.data[i+2];c++;
  }
  const b=sum/c;
  return cfg.polarity==='light' ? b>cfg.thresh : b<cfg.thresh;
}

function readDigits(img){
  // assume up to 5 digit cells across the ROI; auto-detect used cells by activity
  const cells=5, out=[];
  for(let c=0;c<cells;c++){
    const x0=c/cells, cw=1/cells;
    let pat=0, anyLit=false;
    for(let s=0;s<7;s++){
      const sx=x0+SEG_PTS[s][0]*cw, sy=SEG_PTS[s][1];
      if(lit(img,sx,sy)){pat|=(1<<(6-s));anyLit=true;}
    }
    out.push(anyLit?(SEG_MAP[pat]??'?'):' ');
  }
  return out.join('').trim();
}

function parseReading(raw){
  let s=raw.replace(/\s+/g,'');
  if(!s||s.includes('?'))return {ok:false,raw};
  // insert decimal point per config
  const d=cfg.decimals;
  if(d>0 && s.length>d){
    s=s.slice(0,-d)+'.'+s.slice(-d);
  }
  const v=parseFloat(s);
  return isNaN(v)?{ok:false,raw}:{ok:true,v,raw};
}

/* ---------- sampling loop ---------- */
function sampleOnce(){
  const img=grabROI();if(!img)return;
  const raw=readDigits(img);
  const r=parseReading(raw);
  if(r.ok){
    $('val').textContent=r.v.toFixed(cfg.decimals);
    $('val').classList.add('live');
    $('conf').textContent='';
    if(running){
      const t=(Date.now()-t0)/1000;
      data.push({t,w:r.v});
      drawChart();updateStats();
    }
  }else{
    $('conf').textContent='no read';
    $('val').classList.remove('live');
  }
}

/* ---------- chart ---------- */
function drawChart(){
  const dpr=window.devicePixelRatio||1;
  const r=chart.parentElement.getBoundingClientRect();
  chart.width=r.width*dpr;chart.height=r.height*dpr;
  const ctx=chart.getContext('2d');ctx.scale(dpr,dpr);
  const W=r.width,H=r.height,L=34,R=10,T=30,B=22;
  ctx.clearRect(0,0,W,H);
  if(data.length<2)return;
  const tMax=Math.max(2,data[data.length-1].t);
  const wMax=Math.max(2,...data.map(d=>d.w))*1.1;
  const X=t=>L+(t/tMax)*(W-L-R);
  const Y=w=>H-B-(w/wMax)*(H-T-B);
  // grid
  ctx.strokeStyle='rgba(239,234,218,.08)';ctx.lineWidth=1;
  ctx.fillStyle='#76707f';ctx.font='9px ui-monospace';
  for(let i=0;i<=4;i++){
    const w=wMax*i/4, y=Y(w);
    ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(W-R,y);ctx.stroke();
    ctx.fillText(w.toFixed(0),4,y+3);
  }
  // flow-rate area = derivative? keep simple: line + fill
  ctx.beginPath();ctx.moveTo(X(data[0].t),Y(data[0].w));
  data.forEach(d=>ctx.lineTo(X(d.t),Y(d.w)));
  ctx.lineTo(X(data[data.length-1].t),H-B);ctx.lineTo(X(data[0].t),H-B);ctx.closePath();
  const g=ctx.createLinearGradient(0,T,0,H-B);
  g.addColorStop(0,'rgba(255,77,46,.35)');g.addColorStop(1,'rgba(255,77,46,0)');
  ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.moveTo(X(data[0].t),Y(data[0].w));
  data.forEach(d=>ctx.lineTo(X(d.t),Y(d.w)));
  ctx.strokeStyle='#ff4d2e';ctx.lineWidth=2;ctx.stroke();
  // last point
  const last=data[data.length-1];
  ctx.fillStyle='#c8ff00';ctx.beginPath();ctx.arc(X(last.t),Y(last.w),3.5,0,7);ctx.fill();
}

function updateStats(){
  if(!data.length){$('stats').innerHTML='';return;}
  const last=data[data.length-1];
  let flow=0;
  if(data.length>3){
    const a=data[data.length-4], b=last;
    flow=(b.w-a.w)/Math.max(.1,(b.t-a.t));
  }
  $('stats').innerHTML=
    `time <span>${last.t.toFixed(1)}s</span><br>`+
    `final <span>${last.w.toFixed(cfg.decimals)}g</span><br>`+
    `flow <span>${flow.toFixed(1)}g/s</span>`;
}

/* ---------- preview in tray ---------- */
function updatePreview(){
  const img=grabROI();if(!img)return;
  const pv=$('pvCanvas'),ctx=pv.getContext('2d');
  // render thresholded view so user sees what the recognizer sees
  const tmp=document.createElement('canvas');tmp.width=img.width;tmp.height=img.height;
  const tc=tmp.getContext('2d');const id=tc.createImageData(img.width,img.height);
  for(let i=0;i<img.data.length;i+=4){
    const b=0.299*img.data[i]+0.587*img.data[i+1]+0.114*img.data[i+2];
    const on=cfg.polarity==='light'?b>cfg.thresh:b<cfg.thresh;
    const v=on?255:0;id.data[i]=id.data[i+1]=0;id.data[i+2]=0;
    if(on){id.data[i]=200;id.data[i+1]=255;id.data[i+2]=0;}
    id.data[i+3]=255;
  }
  tc.putImageData(id,0,0);
  ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,pv.width,pv.height);
  ctx.drawImage(tmp,0,0,pv.width,pv.height);
  const r=parseReading(readDigits(img));
  $('pvVal').textContent=r.ok?r.v.toFixed(cfg.decimals):'––';
}

/* ---------- controls ---------- */
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('show'),1600);}

$('runBtn').addEventListener('click',()=>{
  running=!running;
  if(running){
    if(!data.length)t0=Date.now();
    else t0=Date.now()-data[data.length-1].t*1000;
    $('runBtn').textContent='Stop';$('runBtn').classList.add('stop');
    toast('Recording — sampling every second');
  }else{
    $('runBtn').textContent='Start';$('runBtn').classList.remove('stop');
  }
});
$('clrBtn').addEventListener('click',()=>{data=[];drawChart();updateStats();$('stats').innerHTML='';toast('Cleared');});
$('calBtn').addEventListener('click',()=>{$('tray').classList.add('open');updatePreview();});
$('doneBtn').addEventListener('click',()=>$('tray').classList.remove('open'));

$('thresh').addEventListener('input',e=>{cfg.thresh=+e.target.value;$('thVal').textContent=cfg.thresh;updatePreview();});
$('decimals').addEventListener('input',e=>{cfg.decimals=+e.target.value;$('decVal').textContent=cfg.decimals;updatePreview();});
$('polLight').addEventListener('click',()=>{cfg.polarity='light';$('polLight').classList.add('on');$('polDark').classList.remove('on');updatePreview();});
$('polDark').addEventListener('click',()=>{cfg.polarity='dark';$('polDark').classList.add('on');$('polLight').classList.remove('on');updatePreview();});

/* continuous live read (always), record only when running */
setInterval(sampleOnce, 1000);

cam.addEventListener('loadedmetadata',()=>{layoutRoi();drawChart();});
window.addEventListener('resize',()=>{layoutRoi();drawChart();});
startCam();
</script>
</body>
</html>
